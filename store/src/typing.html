<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .doc { width: 560px; padding: 44px 48px; font-size: 25px; line-height: 1.7; }
  .label { font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8c959f; margin-bottom: 6px; }
  .typed { color: #8c959f; margin-bottom: 26px; }
  .typed s { text-decoration-color: #d1242f; text-decoration-thickness: 2px; }
  .fixed b { color: #1a7f37; font-weight: 600; background: #dafbe1; border-radius: 4px; padding: 0 3px; }
</style></head><body>
  <div class="copy">
    <div class="brand"><img src="../../icons/icon-128.png" alt="">Basic Autocorrect</div>
    <h1>Autocorrect for your browser.</h1>
    <p class="sub">Fixes obvious typos the moment you finish a word, like your phone does. No popups, nothing to accept. Works in Google Docs.</p>
  </div>
  <div class="card doc">
    <div class="label">You type</div>
    <div class="typed">i <s>dont</s> think <s>teh</s> meeting <s>cant</s> wait <s>untill</s> friday</div>
    <div class="label">You get</div>
    <div class="fixed"><b>I</b> <b>don't</b> think <b>the</b> meeting <b>can't</b> wait <b>until</b> <b>Friday</b></div>
  </div>
</body></html>
