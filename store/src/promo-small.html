<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 440px; height: 280px; padding: 0 34px; gap: 0; background: linear-gradient(150deg, #2563eb, #1d4ed8); color: #fff; }
  .wrap { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .row img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .tag { font-size: 17px; line-height: 1.4; color: #dbe7ff; }
  .demo { font-size: 18px; background: rgba(255,255,255,.14); border-radius: 10px; padding: 8px 12px; }
  .demo s { color: #c7d6ff; } .demo b { color: #b9f6ca; }
</style></head><body>
  <div class="wrap">
    <div class="row"><img src="../../icons/icon-128.png" alt=""><div class="name">Basic Autocorrect</div></div>
    <div class="demo"><s>dont</s> → <b>don't</b> &nbsp; <s>teh</s> → <b>the</b></div>
    <div class="tag">Autocorrect for your browser. Your keystrokes never leave it.</div>
  </div>
</body></html>
